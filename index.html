<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Planning Suite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#2b2620; --paper:#f7f4ee; --rule:#c9c0af;
    --band:#3d3a34; --band-text:#f7f4ee; --accent:#8a6d3b; --accent-soft:#e8ddc8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);font-family:'Iowan Old Style','Georgia',serif;color:var(--ink);display:flex;flex-direction:column;}

  .shell-header{text-align:center;padding:16px 20px 12px;border-bottom:1px solid var(--rule);background:var(--paper);}
  .shell-header .kicker{font-family:'Courier New',monospace;letter-spacing:.3em;text-transform:uppercase;font-size:10px;color:var(--accent);}
  .shell-header h1{font-size:22px;margin:4px 0 12px;font-weight:600;}

  .nav-row{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;}
  .nav-btn{
    font-family:'Courier New',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:#fffdf8;color:var(--ink);border:1px solid var(--rule);padding:7px 14px;cursor:pointer;
  }
  .nav-btn.active{background:var(--band);color:var(--band-text);border-color:var(--band);}
  .nav-btn:hover:not(.active){background:var(--accent-soft);}
  .nav-btn.active:hover{background:var(--accent);}

  .nav-divider{width:1px;height:18px;background:var(--rule);margin:0 2px;}

  .reset-btn{
    font-family:'Courier New',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:#fffdf8;color:#a0453a;border:1px solid #a0453a;padding:7px 14px;cursor:pointer;
  }
  .reset-btn:hover{background:#a0453a;color:#fffdf8;}

  .frame-wrap{flex:1;position:relative;}
  iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;background:var(--paper);display:none;}
  iframe.active{display:block;}

  .loading-msg{
    position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Courier New',monospace;font-size:12px;color:#8a8172;letter-spacing:.1em;text-transform:uppercase;
  }

  .cloud-status{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.05em;color:#6b6355;margin-top:8px;text-transform:uppercase;}
  .cloud-status.ok{color:#4f6b4f;}
  .cloud-status.err{color:#a0453a;}
  .auth-overlay{position:fixed;inset:0;background:rgba(43,38,32,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .auth-card{width:min(420px,calc(100% - 32px));background:var(--paper);border:1px solid var(--rule);padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.18);}
  .auth-card h2{margin:0 0 8px;font-size:22px;font-weight:600;text-align:center;}
  .auth-card p{font-size:13px;line-height:1.5;color:#6b6355;margin:0 0 18px;text-align:center;}
  .auth-card label{display:block;font-family:'Courier New',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#6b6355;margin:12px 0 5px;}
  .auth-card input{width:100%;padding:9px 10px;border:1px solid var(--rule);background:#fffdf8;font:14px Georgia,serif;}
  .auth-card button{width:100%;margin-top:16px;}
  .auth-error{font-size:12px;color:#a0453a;margin-top:10px;text-align:center;min-height:16px;}
  .signed-in{font-family:'Courier New',monospace;font-size:10px;color:#6b6355;text-transform:none;margin-left:4px;}
</style>
</head>
<body>

<div class="shell-header">
  <div class="kicker">What's Best Next</div>
  <h1>Weekly Planning Suite</h1>
  <div class="nav-row">
    <button class="nav-btn active" id="navPlan" onclick="showView('plan')">Weekly Plan</button>
    <button class="nav-btn" id="navProcess" onclick="showView('process')">Weekly Process</button>
    <button class="nav-btn" id="navPriorities" onclick="showView('priorities')">Weekly Priorities</button>
    <button class="nav-btn" id="navTracker" onclick="showView('tracker')">Action Tracker</button>
    <button class="nav-btn" id="navMeals" onclick="showView('meals')">Meal Planning</button>
    <button class="nav-btn" id="navRoles" onclick="showView('roles')">Roles &amp; Activities</button>
    <div class="nav-divider"></div>
    <button class="nav-btn" onclick="exportAll()">Export (.json)</button>
    <button class="nav-btn" onclick="document.getElementById('importAllFile').click()">Import (.json)</button>
    <input type="file" id="importAllFile" accept="application/json" style="display:none">
    <div class="nav-divider"></div>
    <button class="reset-btn" onclick="resetWeek()">Start a new week</button>
  </div>
  <div class="cloud-status" id="cloudStatus">Connecting to shared planner…</div>
</div>

<div class="auth-overlay" id="authOverlay" style="display:none">
  <div class="auth-card">
    <h2>Weekly Planning Suite</h2>
    <p>Sign in to access the shared planner.</p>
    <form id="authForm">
      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" autocomplete="username" required>
      <label for="authPassword">Password</label>
      <input id="authPassword" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="auth-error" id="authError"></div>
    </form>
  </div>
</div>

<div class="frame-wrap">
  <div class="loading-msg" id="loadingMsg">Loading…</div>
  <iframe id="planFrame" class="active"></iframe>
  <iframe id="processFrame"></iframe>
  <iframe id="prioritiesFrame"></iframe>
  <iframe id="trackerFrame"></iframe>
  <iframe id="mealsFrame"></iframe>
  <iframe id="rolesFrame"></iframe>
</div>

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i]=binary.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}

function setCloudStatus(text, cls=''){
  const el=document.getElementById('cloudStatus');
  if(el){ el.textContent=text; el.className='cloud-status'+(cls?' '+cls:''); }
}
function localValue(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function localJson(key){
  const raw=localValue(key); if(raw===null) return null;
  try{return JSON.parse(raw);}catch(e){return null;}
}
async function loadCloudState(){
  const {data,error}=await supabaseClient.from('planner_state').select('state_key,state_data').in('state_key',CLOUD_KEYS);
  if(error) throw error;
  return new Map((data||[]).map(r=>[r.state_key,r.state_data]));
}
async function saveCloudKey(key, raw){
  if(!cloudReady || cloudApplying || !CLOUD_KEYS.includes(key)) return;
  let stateData={};
  if(raw!==null){ try{ stateData=JSON.parse(raw); }catch(e){ stateData={raw:String(raw)}; } }
  const {error}=await supabaseClient.from('planner_state').upsert({state_key:key,state_data:stateData,updated_at:new Date().toISOString()},{onConflict:'state_key'});
  if(error){ console.error('Supabase save failed',key,error); setCloudStatus('Cloud save error','err'); }
}
function queueCloudSave(key, raw){
  if(!cloudReady || cloudApplying || !CLOUD_KEYS.includes(key)) return;
  clearTimeout(cloudSyncTimers[key]);
  cloudSyncTimers[key]=setTimeout(async()=>{
    await saveCloudKey(key,raw);
    if(cloudReady) setCloudStatus('Shared • saved','ok');
  },250);
}
async function syncCloudOnBoot(){
  const cloud=await loadCloudState();
  cloudApplying=true;
  try{
    // Cloud is authoritative once it contains a key. If the cloud is empty for a key,
    // preserve the current browser copy and upload it as the initial shared state.
    for(const key of CLOUD_KEYS){
      if(cloud.has(key)){
        localStorage.setItem(key,JSON.stringify(cloud.get(key)));
      }
    }
  }finally{ cloudApplying=false; }

  // Upload any local states that did not yet exist in Supabase.
  for(const key of CLOUD_KEYS){
    if(!cloud.has(key)){
      const raw=localValue(key);
      if(raw!==null) await saveCloudKey(key,raw);
    }
  }
  cloudReady=true;
}

  if(error){ errEl.textContent=error.message; return false; }

}

}

let latestProcessState = null;
window.addEventListener('message', function(event){
  const data = event && event.data;
  if(data && data.type === 'wbn-process-state' && data.state && data.state.items){
    try{ latestProcessState = JSON.parse(JSON.stringify(data.state)); }catch(e){ latestProcessState = data.state; }
  }
});

window.getProcessState = function(){
  try {
    if(processFrame && processFrame.contentWindow && typeof processFrame.contentWindow.getProcessState === 'function'){
      const state = processFrame.contentWindow.getProcessState();
      if(state && state.items) return state;
    }
  } catch(e) {}
  if(latestProcessState && latestProcessState.items) return latestProcessState;
  try {
    const raw = localStorage.getItem('wbn-weekly-process-v1');
    if(raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
};

// ---- Cross-frame bridge ----
window.planBridge = function(action, data){
  switch(action){

    // Weekly Priorities: explicitly pull the current Weekly Process state.
    // The parent performs the handoff so Priorities never has to reach across iframe boundaries.
    case 'pullFromProcess': {
      const deliver = function(processState){
        if(processState && processState.items && typeof processState.items === 'object'){
          try{ prioritiesFrame.contentWindow.receiveProcessState(processState); }
          catch(e){ try{ prioritiesFrame.contentWindow.importProcessState(processState); }catch(ignore){} }
          showView('priorities');
          return true;
        }
        return false;
      };

      // Weekly Process and the shell use the same origin. Read the persisted
      // Process state directly first; this avoids iframe/message timing issues.
      let processState = null;
      try{
        const raw = localStorage.getItem('wbn-weekly-process-v1');
        if(raw) processState = JSON.parse(raw);
      }catch(e){}

      if(!deliver(processState)){
        // Fallbacks for older/current sessions where storage is unavailable.
        processState = window.getProcessState();
        if(!deliver(processState)){
          try{ processFrame.contentWindow.postMessage({type:'wbn-request-process-state'}, '*'); }catch(e){}
          setTimeout(function(){
            let retry = window.getProcessState();
            if(!deliver(retry)){
              try{
                const raw = localStorage.getItem('wbn-weekly-process-v1');
                retry = raw ? JSON.parse(raw) : null;
              }catch(e){ retry = null; }
              if(!deliver(retry)){
                try{ prioritiesFrame.contentWindow.receiveProcessState(null); }catch(e){}
              }
            }
          }, 250);
        }
      }
      break;
    }

    // Weekly Priorities checked/unchecked → tell Action Tracker
    case 'rolesChanged':
      try{ planFrame.contentWindow.refreshRoles(data); }catch(e){}
      try{ trackerFrame.contentWindow.refreshRoles(); }catch(e){}
      break;

    case 'dayCountChanged':
      try{ prioritiesFrame.contentWindow.refreshDays(); }catch(e){}
      break;

    case 'priorityToggled':
      if(data.done && data.actionId){
        try{ trackerFrame.contentWindow.markActionDone(data.actionId); }catch(e){}
      }
      break;

    // Action Tracker "→ This Week" → send item to Weekly Priorities
    case 'sendToWeek':
      try{ prioritiesFrame.contentWindow.receiveItem(data); }catch(e){}
      showView('priorities');
      break;

    // Action Tracker checked action → reflect in Weekly Priorities AND Weekly Process
    case 'trackerActionToggled':
      if(data.actionId){
        if(data.done){
          try{ prioritiesFrame.contentWindow.markDoneByActionId(data.actionId); }catch(e){}
          try{ processFrame.contentWindow.markItemDoneById(data.actionId, true); }catch(e){}
        } else {
          try{ prioritiesFrame.contentWindow.markDoneByActionId(data.actionId, false); }catch(e){}
          try{ processFrame.contentWindow.markItemDoneById(data.actionId, false); }catch(e){}
        }
      }
      break;

    // Weekly Priorities "View project" → open action tracker at that project
    case 'openProject':
      try{ trackerFrame.contentWindow.openProjectById(data.projectId); }catch(e){}
      showView('tracker');
      break;

    // Weekly Process step 3.4 checked off a tracker standalone action
    case 'processSmallActionChecked':
      if(data.actionId){
        try{ trackerFrame.contentWindow.markActionDone(data.actionId); }catch(e){}
        try{ prioritiesFrame.contentWindow.markDoneByActionId(data.actionId, data.done); }catch(e){}
      }
      break;

    // Weekly Process step 3.4 checked off a project's action
    case 'processProjectActionChecked':
      if(data.projectId && data.actionId){
        try{ trackerFrame.contentWindow.markProjectActionDone(data.projectId, data.actionId); }catch(e){}
        try{ prioritiesFrame.contentWindow.markDoneByActionId(data.actionId, data.done); }catch(e){}
      }
      break;

    // Weekly Priorities checked off a specific project sub-action → tell tracker
    case 'prioritySubActionChecked':
      if(data.projectId && data.actionId){
        try{ trackerFrame.contentWindow.markProjectActionDone(data.projectId, data.actionId); }catch(e){}
      }
      break;

    // Weekly Priorities checked off a standalone tracker action → tell tracker
    case 'priorityTrackerActionDone':
      if(data.actionId){
        try{ trackerFrame.contentWindow.markActionDone(data.actionId); }catch(e){}
      }
      break;
  }
};

// ---- Reset week (plan + process + priorities; NOT action tracker) ----
function resetWeek(){
  if(!confirm('Start a new week?\n\nThis clears the Weekly Plan, Weekly Process, and Weekly Priorities.\n\nUncompleted manual items will be saved to your Action Tracker. Your tracker projects, actions, and backburner are preserved.\n\nExport first if you want to archive this week.')) return;

  // Collect uncompleted manual items BEFORE clearing
  let manualItems = [];
  try{ manualItems = manualItems.concat(processFrame.contentWindow.getUncompletedManualItems()||[]); }catch(e){}
  try{ manualItems = manualItems.concat(prioritiesFrame.contentWindow.getUncompletedManualItems()||[]); }catch(e){}

  // Reset tracker sent flags (tracker is never cleared)
  try{ trackerFrame.contentWindow.resetSentFlags(); }catch(e){}

  // Add manual items to tracker (large→projects, medium/small→actions)
  manualItems.forEach(item => {
    try{
      if(item.size === 'large'){
        trackerFrame.contentWindow.addManualProject({ text: item.text });
      } else {
        trackerFrame.contentWindow.addManualAction({ text: item.text, size: item.size });
      }
    }catch(e){}
  });

  // Clear the three localStorage keys directly (parent and iframes share same origin)
  try{ localStorage.removeItem('wbn-weekly-plan-v1'); }catch(e){}
  try{ localStorage.removeItem('wbn-weekly-process-v1'); }catch(e){}
  try{ localStorage.removeItem('wbn-weekly-priorities-v1'); }catch(e){}
  try{ localStorage.removeItem('wbn-meal-planning-v1'); }catch(e){}
  // These removals happen in the parent window, so explicitly mirror the clears to Supabase.
  queueCloudSave('wbn-weekly-plan-v1', null);
  queueCloudSave('wbn-weekly-process-v1', null);
  queueCloudSave('wbn-weekly-priorities-v1', null);
  queueCloudSave('wbn-meal-planning-v1', null);

  // Reload the weekly frames that belong to the current week. Roles & Activities is intentionally preserved.
  planFrame.srcdoc       = b64ToUtf8(PLAN_HTML_B64);
  processFrame.srcdoc    = b64ToUtf8(PROCESS_HTML_B64);
  prioritiesFrame.srcdoc = b64ToUtf8(PRIORITIES_HTML_B64);
  mealsFrame.srcdoc      = b64ToUtf8(MEALS_HTML_B64);
}

// ---- Export / Import (all 4 frames) ----
function framesReady(){ return loadedCount>=TOTAL_FRAMES; }

function exportAll(){
  if(!framesReady()){ alert('Still loading — try again in a moment.'); return; }
  let planData=null, processData=null, prioritiesData=null, trackerData=null, mealData=null, rolesData=null;
  try{ planData       = planFrame.contentWindow.collectPlanData(); }catch(e){}
  try{ processData    = processFrame.contentWindow.getProcessState(); }catch(e){}
  try{ prioritiesData = prioritiesFrame.contentWindow.getPrioritiesState(); }catch(e){}
  try{ trackerData    = trackerFrame.contentWindow.getTrackerState(); }catch(e){}
  try{ mealData       = mealsFrame.contentWindow.getMealState(); }catch(e){}
  try{ rolesData      = rolesFrame.contentWindow.getRolesState(); }catch(e){}

  const weekLabel = (planData&&planData.weekLabel) ? planData.weekLabel : 'weekly-planning';
  const payload = { exportedAt: new Date().toISOString(), roles: rolesData, plan: planData, process: processData, priorities: prioritiesData, tracker: trackerData, meals: mealData };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = weekLabel.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('importAllFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  if(!framesReady()){ alert('Still loading — try again in a moment.'); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(data.plan)       try{ planFrame.contentWindow.applyPlanData(data.plan); }catch(ex){}
      if(data.process)    try{ processFrame.contentWindow.applyProcessState(data.process); }catch(ex){}
      if(data.priorities) try{ prioritiesFrame.contentWindow.applyPrioritiesState(data.priorities); }catch(ex){}
      if(data.tracker)    try{ trackerFrame.contentWindow.applyTrackerState(data.tracker); }catch(ex){}
      if(data.meals)      try{ mealsFrame.contentWindow.applyMealState(data.meals); }catch(ex){}
      if(data.roles)      try{ rolesFrame.contentWindow.applyRolesState(data.roles); }catch(ex){}
    }catch(err){ alert('That file could not be read as a valid weekly planning export.'); }
  };
  reader.readAsText(file);
  e.target.value='';
});
</script>
