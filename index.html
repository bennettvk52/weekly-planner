<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Planning Suite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#2b2620; --paper:#f7f4ee; --rule:#c9c0af;
    --band:#3d3a34; --band-text:#f7f4ee; --accent:#8a6d3b; --accent-soft:#e8ddc8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);font-family:'Iowan Old Style','Georgia',serif;color:var(--ink);display:flex;flex-direction:column;}

  .shell-header{text-align:center;padding:16px 20px 12px;border-bottom:1px solid var(--rule);background:var(--paper);}
  .shell-header .kicker{font-family:'Courier New',monospace;letter-spacing:.3em;text-transform:uppercase;font-size:10px;color:var(--accent);}
  .shell-header h1{font-size:22px;margin:4px 0 12px;font-weight:600;}

  .nav-row{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;}
  .nav-btn{
    font-family:'Courier New',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:#fffdf8;color:var(--ink);border:1px solid var(--rule);padding:7px 14px;cursor:pointer;
  }
  .nav-btn.active{background:var(--band);color:var(--band-text);border-color:var(--band);}
  .nav-btn:hover:not(.active){background:var(--accent-soft);}
  .nav-btn.active:hover{background:var(--accent);}

  .nav-divider{width:1px;height:18px;background:var(--rule);margin:0 2px;}

  .reset-btn{
    font-family:'Courier New',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    background:#fffdf8;color:#a0453a;border:1px solid #a0453a;padding:7px 14px;cursor:pointer;
  }
  .reset-btn:hover{background:#a0453a;color:#fffdf8;}

  .frame-wrap{flex:1;position:relative;}
  iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;background:var(--paper);display:none;}
  iframe.active{display:block;}

  .loading-msg{
    position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Courier New',monospace;font-size:12px;color:#8a8172;letter-spacing:.1em;text-transform:uppercase;
  }

  .cloud-status{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.05em;color:#6b6355;margin-top:8px;text-transform:uppercase;}
  .cloud-status.ok{color:#4f6b4f;}
  .cloud-status.err{color:#a0453a;}
  .auth-overlay{position:fixed;inset:0;background:rgba(43,38,32,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .auth-card{width:min(420px,calc(100% - 32px));background:var(--paper);border:1px solid var(--rule);padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.18);}
  .auth-card h2{margin:0 0 8px;font-size:22px;font-weight:600;text-align:center;}
  .auth-card p{font-size:13px;line-height:1.5;color:#6b6355;margin:0 0 18px;text-align:center;}
  .auth-card label{display:block;font-family:'Courier New',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#6b6355;margin:12px 0 5px;}
  .auth-card input{width:100%;padding:9px 10px;border:1px solid var(--rule);background:#fffdf8;font:14px Georgia,serif;}
  .auth-card button{width:100%;margin-top:16px;}
  .auth-error{font-size:12px;color:#a0453a;margin-top:10px;text-align:center;min-height:16px;}
  .signed-in{font-family:'Courier New',monospace;font-size:10px;color:#6b6355;text-transform:none;margin-left:4px;}
  .profile-switch{display:flex;align-items:center;gap:3px;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;}
  .profile-label{color:#6b6355;margin-right:3px;}
  .profile-btn{font-family:'Courier New',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;background:#fffdf8;color:var(--ink);border:1px solid var(--rule);padding:6px 10px;cursor:pointer;}
  .profile-btn.active{background:var(--accent);color:#fffdf8;border-color:var(--accent);}
  .profile-btn:hover:not(.active){background:var(--accent-soft);}
  .profile-btn:disabled{opacity:.55;cursor:wait;}
</style>
</head>
<body>

<div class="shell-header">
  <div class="kicker">What's Best Next</div>
  <h1>Weekly Planning Suite</h1>
  <div class="nav-row">
    <button class="nav-btn active" id="navPlan" onclick="showView('plan')">Weekly Plan</button>
    <button class="nav-btn" id="navProcess" onclick="showView('process')">Weekly Process</button>
    <button class="nav-btn" id="navPriorities" onclick="showView('priorities')">Weekly Priorities</button>
    <button class="nav-btn" id="navTracker" onclick="showView('tracker')">Action Tracker</button>
    <button class="nav-btn" id="navMeals" onclick="showView('meals')">Meal Planning</button>
    <button class="nav-btn" id="navRoles" onclick="showView('roles')">Roles &amp; Activities</button>
    <div class="nav-divider"></div>
    <button class="nav-btn" onclick="enablePushNotifications()">Enable phone reminders</button>
    <button class="nav-btn" onclick="exportAll()">Export (.json)</button>
    <button class="nav-btn" onclick="document.getElementById('importAllFile').click()">Import (.json)</button>
    <input type="file" id="importAllFile" accept="application/json" style="display:none">
    <div class="nav-divider"></div>
    <button class="reset-btn" onclick="resetWeek()">Start a new week</button>
    <div class="nav-divider"></div>
    <div class="profile-switch" aria-label="Planner version">
      <span class="profile-label">Version</span>
      <button class="profile-btn active" id="profileBennett" onclick="switchProfile('Bennett')">Bennett</button>
      <button class="profile-btn" id="profileKyra" onclick="switchProfile('Kyra')">Kyra</button>
    </div>
  </div>
  <div class="cloud-status" id="cloudStatus">Connecting to shared planner…</div>
</div>

<div class="auth-overlay" id="authOverlay" style="display:none">
  <div class="auth-card">
    <h2>Weekly Planning Suite</h2>
    <p>Sign in to access the shared planner.</p>
    <form id="authForm">
      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" autocomplete="username" required>
      <label for="authPassword">Password</label>
      <input id="authPassword" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="auth-error" id="authError"></div>
    </form>
  </div>
</div>

<div class="frame-wrap">
  <div class="loading-msg" id="loadingMsg">Loading…</div>
  <iframe id="planFrame" class="active"></iframe>
  <iframe id="processFrame"></iframe>
  <iframe id="prioritiesFrame"></iframe>
  <iframe id="trackerFrame"></iframe>
  <iframe id="mealsFrame"></iframe>
  <iframe id="rolesFrame"></iframe>
</div>

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i]=binary.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}

function profileKey(key, profile=activeProfile){ return profile.toLowerCase()+'::'+key; }
function localValue(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function localJson(key){ const raw=localValue(key); if(raw===null) return null; try{return JSON.parse(raw);}catch(e){return null;} }
function setLocalValue(key, value){ try{ if(value===null) localStorage.removeItem(key); else localStorage.setItem(key,JSON.stringify(value)); }catch(e){} }
function parseRaw(raw){
  if(raw===null) return {};
  try{return JSON.parse(raw);}catch(e){return {raw:String(raw)};}
}
function rowFor(profile,key,stateData,updatedAt){
  return {state_key:profileKey(key,profile),state_data:stateData||{},updated_at:updatedAt||new Date().toISOString()};
}

async function fetchProfileState(profile){
  const keys=CLOUD_KEYS.map(k=>profileKey(k,profile));
  const {data,error}=await supabaseClient.from('planner_state').select('state_key,state_data,updated_at').in('state_key',keys);
  if(error) throw error;
  return new Map((data||[]).map(r=>[r.state_key.replace(profile.toLowerCase()+'::',''),r]));
}

async function migrateLegacyToBennett(){
  // The first shared version stored unprofiled rows. Preserve that existing data as Bennett's version.
  const bennett=await fetchProfileState('Bennett');
  const {data:legacy,error}=await supabaseClient.from('planner_state').select('state_key,state_data,updated_at').in('state_key',CLOUD_KEYS);
  if(error) throw error;
  if(bennett.size || !(legacy||[]).length) return;
  for(const row of legacy||[]){
    const {error:insertError}=await supabaseClient.from('planner_state').insert(rowFor('Bennett',row.state_key,row.state_data,row.updated_at));
    if(insertError && insertError.code!=='23505') throw insertError;
  }
}

async function saveCloudKey(key, raw, options={}){
  if(!cloudReady || cloudApplying || !CLOUD_KEYS.includes(key)) return {ok:false,skipped:true};
  const profile=options.profile||activeProfile;
  const expected=options.expectedUpdatedAt !== undefined ? options.expectedUpdatedAt : (cloudMeta[profile][key]?.updatedAt||null);
  const stateData=parseRaw(raw);
  const now=new Date().toISOString();
  const stateKey=profileKey(key,profile);
  let result;

  if(expected){
    result=await supabaseClient.from('planner_state')
      .update({state_data:stateData,updated_at:now})
      .eq('state_key',stateKey)
      .eq('updated_at',expected)
      .select('updated_at')
      .maybeSingle();
    if(result.error) throw result.error;
    if(!result.data){
      return {ok:false,conflict:true};
    }
  }else{
    result=await supabaseClient.from('planner_state')
      .insert({state_key:stateKey,state_data:stateData,updated_at:now})
      .select('updated_at')
      .maybeSingle();
    if(result.error){
      if(result.error.code==='23505') return {ok:false,conflict:true};
      throw result.error;
    }
  }
  cloudMeta[profile][key]={updatedAt:result.data?.updated_at||now};
  return {ok:true};
}

async function reloadFromCloud(profile=activeProfile, options={}){
  const rows=await fetchProfileState(profile);
  cloudApplying=true;
  try{
    for(const key of CLOUD_KEYS){
      const row=rows.get(key);
      if(row){
        localStorage.setItem(key,JSON.stringify(row.state_data));
        cloudMeta[profile][key]={updatedAt:row.updated_at};
      }else{
        localStorage.removeItem(key);
        delete cloudMeta[profile][key];
      }
    }
  }finally{ cloudApplying=false; }
  if(!options.skipReload) reloadFrames();
  return rows;
}

async function syncCloudOnBoot(){
  await migrateLegacyToBennett();
  const rows=await fetchProfileState(activeProfile);
  cloudApplying=true;
  try{
    for(const key of CLOUD_KEYS){
      const row=rows.get(key);
      if(row){
        localStorage.setItem(key,JSON.stringify(row.state_data));
        cloudMeta[activeProfile][key]={updatedAt:row.updated_at};
      }
    }
  }finally{ cloudApplying=false; }

  // If this profile has never been used, start it empty rather than copying another profile's data.
  if(rows.size===0){
    for(const key of CLOUD_KEYS) localStorage.removeItem(key);
  }

  // Upload only local data that belongs to this profile and only when that profile has no cloud row.
  if(rows.size===0){
    for(const key of CLOUD_KEYS){
      const raw=localValue(key);
      if(raw!==null){
        const result=await saveCloudKey(key,raw,{profile:activeProfile,expectedUpdatedAt:null});
        if(!result.ok && !result.skipped) throw new Error('Could not initialize '+activeProfile+' '+key);
      }
    }
  }
  cloudReady=true;
}

}

async function queueCloudSaveAsync(key, raw){
  if(!cloudReady || cloudApplying || switchingProfile || !CLOUD_KEYS.includes(key)) return;
  clearTimeout(cloudSyncTimers[key]);
  cloudSyncTimers[key]=setTimeout(async()=>{
    try{
      const result=await saveCloudKey(key,raw);
      if(result.conflict){
        setCloudStatus('Change conflict • refreshing','err');
        await reloadFromCloud(activeProfile);
        alert('Another change was saved before this change could be saved. The other version was kept, and this planner was refreshed so you are working from the current shared data.');
      }else if(result.ok && cloudReady){
        setCloudStatus(activeProfile+' • Shared • saved','ok');
      }
    }catch(e){
      console.error('Supabase save failed',key,e);
      setCloudStatus('Cloud save error','err');
    }
  },250);
}

function queueCloudSave(key,raw){ queueCloudSaveAsync(key,raw); }

async function startRealtime(){
  if(realtimeChannel) return;
  realtimeChannel=supabaseClient.channel('planner-state-realtime')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'planner_state'},payload=>handleRealtimeRow(payload.new))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'planner_state'},payload=>handleRealtimeRow(payload.new))
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){ realtimeReady=true; if(cloudReady) setCloudStatus(activeProfile+' • Shared • live','ok'); }
      else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){ realtimeReady=false; if(cloudReady) setCloudStatus(activeProfile+' • Shared • connected (live sync unavailable)','err'); }
    });
}

async function handleRealtimeRow(row){
  if(!cloudReady || cloudApplying || !row || typeof row.state_key!=='string') return;
  const prefix=activeProfile.toLowerCase()+'::';
  if(!row.state_key.startsWith(prefix)) return;
  const key=row.state_key.slice(prefix.length);
  if(!CLOUD_KEYS.includes(key)) return;
  const localMeta=cloudMeta[activeProfile][key];
  if(localMeta?.updatedAt && new Date(row.updated_at).getTime()<=new Date(localMeta.updatedAt).getTime()) return;
  cloudApplying=true;
  try{
    localStorage.setItem(key,JSON.stringify(row.state_data));
    cloudMeta[activeProfile][key]={updatedAt:row.updated_at};
  }finally{ cloudApplying=false; }
  reloadFrames();
  setCloudStatus(activeProfile+' • Shared • live','ok');
}

async function switchProfile(profile){
  if(profile===activeProfile || switchingProfile || !cloudReady) return;
  const buttons=[document.getElementById('profileBennett'),document.getElementById('profileKyra')];
  buttons.forEach(b=>b.disabled=true);
  switchingProfile=true;
  try{
    setCloudStatus('Saving '+activeProfile+'…');
    // Flush the current profile before switching so no recent edit is left behind.
    for(const key of CLOUD_KEYS){
      clearTimeout(cloudSyncTimers[key]);
      const result=await saveCloudKey(key,localValue(key));
      if(result.conflict){
        await reloadFromCloud(activeProfile);
        throw new Error('Another change was saved while switching profiles. '+activeProfile+' was refreshed; please switch again.');
      }
    }
    activeProfile=profile;
    localStorage.setItem(PROFILE_STORAGE_KEY,activeProfile);
    setProfileButtons();
    setCloudStatus('Loading '+activeProfile+'…');
    await reloadFromCloud(activeProfile,{skipReload:true});
    reloadFrames();
    setCloudStatus(activeProfile+' • Shared • connected','ok');
  }catch(e){
    console.error(e);
    setCloudStatus('Profile switch failed','err');
    alert(e.message||'The planner could not switch versions.');
  }finally{
    switchingProfile=false;
    buttons.forEach(b=>b.disabled=false);
  }
}

  return true;
}

async function bootAuthenticated(){
  try{
    const savedProfile=localStorage.getItem(PROFILE_STORAGE_KEY);
    activeProfile=PROFILE_NAMES.includes(savedProfile)?savedProfile:'Bennett';
    setProfileButtons();
    setCloudStatus('Loading '+activeProfile+'…');
    await syncCloudOnBoot();
    await startRealtime();
    reloadFrames();
    document.getElementById('authOverlay').style.display='none';
    setCloudStatus(activeProfile+' • Shared • connected','ok');
  }catch(e){
    console.error(e);
    setCloudStatus('Cloud connection failed','err');
    alert('The planner could not connect to Supabase. The error was:\n\n'+(e.message||e));
  }
}


let loadedCount = 0;
const TOTAL_FRAMES = 6;
function frameLoaded(){ loadedCount++; if(loadedCount>=TOTAL_FRAMES) loadingMsg.style.display='none'; }

[planFrame,processFrame,prioritiesFrame,trackerFrame,mealsFrame,rolesFrame].forEach(f=>f.addEventListener('load',frameLoaded));

async function initApp(){
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(session){
    await bootAuthenticated();
  }else{
    document.getElementById('authOverlay').style.display='flex';
    setCloudStatus('Sign in required');
  }
}

document.getElementById('authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const button=e.target.querySelector('button');
  button.disabled=true; button.textContent='Signing in…';
  const ok=await signIn();
  button.disabled=false; button.textContent='Sign in';

supabaseClient.auth.onAuthStateChange((_event,session)=>{

});

window.addEventListener('storage',e=>{
  if(e.storageArea===localStorage && CLOUD_KEYS.includes(e.key)) queueCloudSave(e.key,e.newValue);
});


// Reminder/push setup. Add the generated VAPID public key here after provisioning the push backend.
const VAPID_PUBLIC_KEY = 'BFA3MVDk7GdUBcWM9SZvnVRzq2pgmfhiSFaTC9fw2w8r7xQnSQjBoe_HarW0pJlcN5ioHFZcGAeGJp0s7F2Stj8';
window.getActiveProfile = () => activeProfile;
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function enablePushNotifications(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){alert('This browser does not support web push. On iPhone, open the planner from its Home Screen web-app icon.');return;}
  if(VAPID_PUBLIC_KEY.startsWith('REPLACE_')){alert('Phone reminders need one-time server setup first. Follow REMINDERS-SETUP.md to configure the VAPID key, Edge Function, and schedule; notifications will not arrive until setup is complete.');return;}
  try{
    const permission=await Notification.requestPermission();if(permission!=='granted'){alert('Notifications were not allowed. You can enable them in your iPhone settings.');return;}
    const reg=await navigator.serviceWorker.register('./sw.js');
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    const {data:{user}}=await supabaseClient.auth.getUser();if(!user)throw new Error('Please sign in again.');
    const {error}=await supabaseClient.from('planner_push_subscriptions').upsert({endpoint:sub.endpoint,subscription:sub.toJSON(),user_id:user.id,profile_name:activeProfile,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
    if(error)throw error;alert('Phone reminders enabled for '+activeProfile+' on this device.');
  }catch(e){console.error(e);alert('Could not enable phone reminders: '+(e.message||e));}
}
window.addEventListener('message',async event=>{
  const d=event.data;if(!d||d.type!=='wbn-reminder-saved'||!cloudReady)return;
  // Reminder configuration remains part of the selected profile's weekly-plan record; the scheduled backend reads it there.
  setCloudStatus(activeProfile+' • reminder saved','ok');
});

initApp();

function showView(view){
  Object.entries(FRAMES).forEach(([k,f])=>{ f.classList.toggle('active', k===view); });
  Object.entries(NAV_IDS).forEach(([k,id])=>{ document.getElementById(id).classList.toggle('active', k===view); });
}

function getRolesState(){
  try{ const raw=localStorage.getItem('wbn-roles-v1'); if(raw){ const r=JSON.parse(raw); if(Array.isArray(r)&&r.length)return r; } }catch(e){}
  try{ return rolesFrame.contentWindow.getRolesState(); }catch(e){}
  return [];
}
function getPlanningDays(){
  try{ const raw=localStorage.getItem('wbn-weekly-plan-v1'); const s=raw?JSON.parse(raw):{}; const n=Math.max(1,Math.min(14,parseInt(s.dayCount)||7)); const defaults=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']; const h=Array.isArray(s.dayHeaders)?s.dayHeaders:[]; return Array.from({length:n},(_,i)=>h[i]||defaults[i]||`Day ${i+1}`); }catch(e){ return ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']; }
}

let latestProcessState = null;
window.addEventListener('message', function(event){
  const data = event && event.data;
  if(data && data.type === 'wbn-process-state' && data.state && data.state.items){
    try{ latestProcessState = JSON.parse(JSON.stringify(data.state)); }catch(e){ latestProcessState = data.state; }
  }
});

window.getProcessState = function(){
  try {
    if(processFrame && processFrame.contentWindow && typeof processFrame.contentWindow.getProcessState === 'function'){
      const state = processFrame.contentWindow.getProcessState();
      if(state && state.items) return state;
    }
  } catch(e) {}
  if(latestProcessState && latestProcessState.items) return latestProcessState;
  try {
    const raw = localStorage.getItem('wbn-weekly-process-v1');
    if(raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
};

// ---- Cross-frame bridge ----
window.planBridge = function(action, data){
  switch(action){

    // Weekly Priorities: explicitly pull the current Weekly Process state.
    // The parent performs the handoff so Priorities never has to reach across iframe boundaries.
    case 'pullFromProcess': {
      const deliver = function(processState){
        if(processState && processState.items && typeof processState.items === 'object'){
          try{ prioritiesFrame.contentWindow.receiveProcessState(processState); }
          catch(e){ try{ prioritiesFrame.contentWindow.importProcessState(processState); }catch(ignore){} }
          showView('priorities');
          return true;
        }
        return false;
      };

      // Weekly Process and the shell use the same origin. Read the persisted
      // Process state directly first; this avoids iframe/message timing issues.
      let processState = null;
      try{
        const raw = localStorage.getItem('wbn-weekly-process-v1');
        if(raw) processState = JSON.parse(raw);
      }catch(e){}

      if(!deliver(processState)){
        // Fallbacks for older/current sessions where storage is unavailable.
        processState = window.getProcessState();
        if(!deliver(processState)){
          try{ processFrame.contentWindow.postMessage({type:'wbn-request-process-state'}, '*'); }catch(e){}
          setTimeout(function(){
            let retry = window.getProcessState();
            if(!deliver(retry)){
              try{
                const raw = localStorage.getItem('wbn-weekly-process-v1');
                retry = raw ? JSON.parse(raw) : null;
              }catch(e){ retry = null; }
              if(!deliver(retry)){
                try{ prioritiesFrame.contentWindow.receiveProcessState(null); }catch(e){}
              }
            }
          }, 250);
        }
      }
      break;
    }

    // Weekly Priorities checked/unchecked → tell Action Tracker
    case 'rolesChanged':
      try{ planFrame.contentWindow.refreshRoles(data); }catch(e){}
      try{ trackerFrame.contentWindow.refreshRoles(); }catch(e){}
      break;

    case 'dayCountChanged':
      try{ prioritiesFrame.contentWindow.refreshDays(); }catch(e){}
      break;

    case 'priorityToggled':
      if(data.done && data.actionId){
        try{ trackerFrame.contentWindow.markActionDone(data.actionId); }catch(e){}
      }
      break;

    // Action Tracker "→ This Week" → send item to Weekly Priorities
    case 'sendToWeek':
      try{ prioritiesFrame.contentWindow.receiveItem(data); }catch(e){}
      showView('priorities');
      break;

    // Action Tracker checked action → reflect in Weekly Priorities AND Weekly Process
    case 'trackerActionToggled':
      if(data.actionId){
        if(data.done){
          try{ prioritiesFrame.contentWindow.markDoneByActionId(data.actionId); }catch(e){}
          try{ processFrame.contentWindow.markItemDoneById(data.actionId, true); }catch(e){}
        } else {
          try{ prioritiesFrame.contentWindow.markDoneByActionId(data.actionId, false); }catch(e){}
          try{ processFrame.contentWindow.markItemDoneById(data.actionId, false); }catch(e){}
        }
      }
      break;

    // Weekly Priorities "View project" → open action tracker at that project
    case 'openProject':
      try{ trackerFrame.contentWindow.openProjectById(data.projectId); }catch(e){}
      showView('tracker');
      break;

    // Weekly Process step 3.4 checked off a tracker standalone action
    case 'processSmallActionChecked':
      if(data.actionId){
        try{ trackerFrame.contentWindow.markActionDone(data.actionId); }catch(e){}
        try{ prioritiesFrame.contentWindow.markDoneByActionId(data.actionId, data.done); }catch(e){}
      }
      break;

    // Weekly Process step 3.4 checked off a project's action
    case 'processProjectActionChecked':
      if(data.projectId && data.actionId){
        try{ trackerFrame.contentWindow.markProjectActionDone(data.projectId, data.actionId); }catch(e){}
        try{ prioritiesFrame.contentWindow.markDoneByActionId(data.actionId, data.done); }catch(e){}
      }
      break;

    // Weekly Priorities checked off a specific project sub-action → tell tracker
    case 'prioritySubActionChecked':
      if(data.projectId && data.actionId){
        try{ trackerFrame.contentWindow.markProjectActionDone(data.projectId, data.actionId); }catch(e){}
      }
      break;

    // Weekly Priorities checked off a standalone tracker action → tell tracker
    case 'priorityTrackerActionDone':
      if(data.actionId){
        try{ trackerFrame.contentWindow.markActionDone(data.actionId); }catch(e){}
      }
      break;
  }
};

// ---- Reset week (plan + process + priorities; NOT action tracker) ----
function resetWeek(){
  if(!confirm('Start a new week?\n\nThis clears the Weekly Plan, Weekly Process, and Weekly Priorities.\n\nUncompleted manual items will be saved to your Action Tracker. Your tracker projects, actions, and backburner are preserved.\n\nExport first if you want to archive this week.')) return;

  // Collect uncompleted manual items BEFORE clearing
  let manualItems = [];
  try{ manualItems = manualItems.concat(processFrame.contentWindow.getUncompletedManualItems()||[]); }catch(e){}
  try{ manualItems = manualItems.concat(prioritiesFrame.contentWindow.getUncompletedManualItems()||[]); }catch(e){}

  // Reset tracker sent flags (tracker is never cleared)
  try{ trackerFrame.contentWindow.resetSentFlags(); }catch(e){}

  // Add manual items to tracker (large→projects, medium/small→actions)
  manualItems.forEach(item => {
    try{
      if(item.size === 'large'){
        trackerFrame.contentWindow.addManualProject({ text: item.text });
      } else {
        trackerFrame.contentWindow.addManualAction({ text: item.text, size: item.size });
      }
    }catch(e){}
  });

  // Clear the three localStorage keys directly (parent and iframes share same origin)
  try{ localStorage.removeItem('wbn-weekly-plan-v1'); }catch(e){}
  try{ localStorage.removeItem('wbn-weekly-process-v1'); }catch(e){}
  try{ localStorage.removeItem('wbn-weekly-priorities-v1'); }catch(e){}
  try{ localStorage.removeItem('wbn-meal-planning-v1'); }catch(e){}
  // These removals happen in the parent window, so explicitly mirror the clears to Supabase.
  queueCloudSave('wbn-weekly-plan-v1', null);
  queueCloudSave('wbn-weekly-process-v1', null);
  queueCloudSave('wbn-weekly-priorities-v1', null);
  queueCloudSave('wbn-meal-planning-v1', null);

  // Reload the weekly frames that belong to the current week. Roles & Activities is intentionally preserved.
  planFrame.srcdoc       = b64ToUtf8(PLAN_HTML_B64);
  processFrame.srcdoc    = b64ToUtf8(PROCESS_HTML_B64);
  prioritiesFrame.srcdoc = b64ToUtf8(PRIORITIES_HTML_B64);
  mealsFrame.srcdoc      = b64ToUtf8(MEALS_HTML_B64);
}

// ---- Export / Import (all 4 frames) ----
function framesReady(){ return loadedCount>=TOTAL_FRAMES; }

function exportAll(){
  if(!framesReady()){ alert('Still loading — try again in a moment.'); return; }
  let planData=null, processData=null, prioritiesData=null, trackerData=null, mealData=null, rolesData=null;
  try{ planData       = planFrame.contentWindow.collectPlanData(); }catch(e){}
  try{ processData    = processFrame.contentWindow.getProcessState(); }catch(e){}
  try{ prioritiesData = prioritiesFrame.contentWindow.getPrioritiesState(); }catch(e){}
  try{ trackerData    = trackerFrame.contentWindow.getTrackerState(); }catch(e){}
  try{ mealData       = mealsFrame.contentWindow.getMealState(); }catch(e){}
  try{ rolesData      = rolesFrame.contentWindow.getRolesState(); }catch(e){}

  const weekLabel = (planData&&planData.weekLabel) ? planData.weekLabel : 'weekly-planning';
  const payload = { exportedAt: new Date().toISOString(), roles: rolesData, plan: planData, process: processData, priorities: prioritiesData, tracker: trackerData, meals: mealData };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = activeProfile.toLowerCase()+'-'+weekLabel.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('importAllFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  if(!framesReady()){ alert('Still loading — try again in a moment.'); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(data.plan)       try{ planFrame.contentWindow.applyPlanData(data.plan); }catch(ex){}
      if(data.process)    try{ processFrame.contentWindow.applyProcessState(data.process); }catch(ex){}
      if(data.priorities) try{ prioritiesFrame.contentWindow.applyPrioritiesState(data.priorities); }catch(ex){}
      if(data.tracker)    try{ trackerFrame.contentWindow.applyTrackerState(data.tracker); }catch(ex){}
      if(data.meals)      try{ mealsFrame.contentWindow.applyMealState(data.meals); }catch(ex){}
      if(data.roles)      try{ rolesFrame.contentWindow.applyRolesState(data.roles); }catch(ex){}
    }catch(err){ alert('That file could not be read as a valid weekly planning export.'); }
  };
  reader.readAsText(file);
  e.target.value='';
});
